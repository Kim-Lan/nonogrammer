name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NITRO_PRESET: node_server

      - name: Verify build
        run: test -f .output/server/index.mjs

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare deployment directory
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "mkdir -p '${{ secrets.APP_DIR }}/.output'"

      - name: Upload build
        run: |
          rsync -az --delete .output/ \
            "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:${{ secrets.APP_DIR }}/.output/"

          rsync -az ecosystem.config.cjs \
            "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:${{ secrets.APP_DIR }}/ecosystem.config.cjs"

      - name: Start or restart application
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} 'bash -se' << 'EOF'
            set -e

            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm use 24

            cd ${{ secrets.APP_DIR }}
            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save
          EOF
